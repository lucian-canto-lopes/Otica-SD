x-api-env: &api-env
  DB_HOST: db
  DB_NAME: ocular
  DB_USER: ocular
  DB_PASS: ${DB_PASSWORD:-ocular_demo_123}
  # Endereço público da API (usado para montar as URLs de webhook do WhatsApp/Meta).
  PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080/api}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@ocular.local}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
  TZ: America/Sao_Paulo

services:
  frontend:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./app/public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
  api:
    build: ./app
    environment: *api-env
    volumes:
      - uploads:/var/www/storage
    depends_on:
      db:
        condition: service_healthy
  worker:
    build: ./app
    command: ["sh", "-c", "sleep 15 && php /var/www/worker.php"]
    restart: unless-stopped
    environment:
      <<: *api-env
      WORKER_INTERVAL: 60
    volumes:
      - uploads:/var/www/storage
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ocular
      MYSQL_USER: ocular
      MYSQL_PASSWORD: ${DB_PASSWORD:-ocular_demo_123}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_demo_123}
      TZ: America/Sao_Paulo
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  mysql_data:
  uploads:
