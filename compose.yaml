x-api-env: &api-env
  DB_HOST: db
  DB_NAME: ocular
  DB_USER: ocular
  DB_PASS: ${DB_PASSWORD:-ocular_demo_123}
  # Endereço público da API (usado para montar as URLs de webhook do WhatsApp/Meta).
  PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080/api}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@ocular.local}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
  TZ: America/Sao_Paulo
  # WhatsApp integrado: servidor Evolution API deste compose (rede interna).
  EVOLUTION_URL: http://evolution:8080
  EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-troque-esta-chave-evolution}
  EVOLUTION_WEBHOOK_BASE: http://api

services:
  frontend:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./app/public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
  api:
    build: ./app
    environment: *api-env
    volumes:
      - uploads:/var/www/storage
    depends_on:
      db:
        condition: service_healthy
  worker:
    build: ./app
    command: ["sh", "-c", "sleep 15 && php /var/www/worker.php"]
    restart: unless-stopped
    environment:
      <<: *api-env
      WORKER_INTERVAL: 15
    volumes:
      - uploads:/var/www/storage
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ocular
      MYSQL_USER: ocular
      MYSQL_PASSWORD: ${DB_PASSWORD:-ocular_demo_123}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_demo_123}
      TZ: America/Sao_Paulo
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
  # Evolution API: conecta o WhatsApp da ótica por QR Code. As instâncias são criadas pelo Ocular.
  evolution:
    image: atendai/evolution-api:v2.2.3
    restart: unless-stopped
    ports:
      # Apenas local: o XAMPP acessa por http://127.0.0.1:8081. Não exponha esta porta na internet.
      - "127.0.0.1:8081:8080"
    environment:
      SERVER_URL: http://evolution:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-troque-esta-chave-evolution}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD:-evolution_demo_123}@evolution-db:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: ocular
      DATABASE_SAVE_DATA_INSTANCE: "true"
      # O histórico de conversas fica no Ocular; a Evolution guarda só a sessão.
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      CONFIG_SESSION_PHONE_CLIENT: Ocular CRM
      CONFIG_SESSION_PHONE_NAME: Chrome
      QRCODE_LIMIT: 30
      DEL_INSTANCE: "false"
      LANGUAGE: pt-BR
      LOG_LEVEL: ERROR,WARN
      TZ: America/Sao_Paulo
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      evolution-db:
        condition: service_healthy
  evolution-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD:-evolution_demo_123}
    volumes:
      - evolution_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  mysql_data:
  uploads:
  evolution_instances:
  evolution_db:
